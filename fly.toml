# fly.toml app configuration file generated for cosplay-manager on 2024-12-13T12:30:38-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'cosplay-manager'
primary_region = 'iad'
console_command = 'php /var/www/html/artisan tinker'

[build]
  [build.args]
    NODE_VERSION = '22'
    PHP_VERSION = '8.4'

[env]
  APP_DEBUG = 'true'
  APP_ENV = 'production'
  APP_NAME = 'CosManage'
  APP_URL = 'https://cosmanage.com'
  AWS_BUCKET = 'cosmanage-production-cosmanageimages-f1l6dwdj5vcb'
  AWS_DEFAULT_REGION = 'us-east-1'
  AWS_USE_PATH_STYLE_ENDPOINT = 'false'
  DB_CONNECTION = 'sqlite'
  DB_DATABASE = '/var/www/html/storage/database/database.sqlite'
  DB_FOREIGN_KEYS = 'true'
  FILESYSTEM_DRIVER = 's3'
  LOG_CHANNEL = 'stderr'
  LOG_LEVEL = 'info'
  LOG_STDERR_FORMATTER = 'Monolog\Formatter\JsonFormatter'
  MAIL_ENCRYPTION = 'null'
  MAIL_FROM_ADDRESS = 'lildragon555@gmail.com'
  MAIL_FROM_NAME = 'help@cosmanage.com'
  MAIL_HOST = 'localhost'
  MAIL_MAILER = 'sendmail'
  MEDIA_DISK = 's3'
  PHP_MAX_FILE_UPLOADS = '50'
  PHP_MEMORY_LIMIT = '512M'
  PHP_POST_MAX_SIZE = '20M'
  PHP_UPLOAD_MAX_FILE_SIZE = '10M'
  SESSION_DRIVER = 'cookie'
  SESSION_LIFETIME = '2678400'
  SESSION_SECURE_COOKIE = 'true'

[[mounts]]
  source = 'storage_vol'
  destination = '/var/www/html/storage'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
